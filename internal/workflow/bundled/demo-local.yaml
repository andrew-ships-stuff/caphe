apiVersion: caphe.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: local-demo
  version: "1.0.0"
spec:
  target:
    type: repository
  policies:
    network: restricted
    executeGeneratedCode: false
    allowActiveTesting: false
  tasks:
    - id: sast
      uses: scanner.opengrep
      with:
        ruleset: .caphe/security.yaml
    - id: sbom
      uses: scanner.syft
      with:
        outputFormat: cyclonedx-json
    - id: normalize
      uses: core.normalize
      needs: [sast, sbom]
    - id: correlate
      uses: core.correlate
      needs: [normalize]
