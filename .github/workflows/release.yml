name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'cmd/caphe/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'scripts/render-homebrew-formula.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            format: tar
          - goos: darwin
            goarch: arm64
            format: tar
          - goos: linux
            goarch: amd64
            format: tar
          - goos: linux
            goarch: arm64
            format: tar
          - goos: windows
            goarch: amd64
            format: zip
          - goos: windows
            goarch: arm64
            format: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Select package version
        shell: bash
        run: |
          version=dev
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo "release tag must be a v-prefixed semantic version" >&2
              exit 2
            }
            version="$GITHUB_REF_NAME"
          fi
          echo "CAPHE_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          ARCHIVE_FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p dist/package
          env -u GOOS -u GOARCH go run ./scripts/embed-runtime -target "$GOOS/$GOARCH"
          binary=caphe
          if [[ "$GOOS" == windows ]]; then binary=caphe.exe; fi
          ldflags='-s -w'
          if [[ "$CAPHE_PACKAGE_VERSION" != dev ]]; then
            # Make the existing source default link-editable in this disposable checkout.
            sed -i 's/^const Version = /var Version = /' internal/cli/root.go
            grep -q '^var Version = ' internal/cli/root.go || {
              echo "internal/cli.Version is not link-editable" >&2
              exit 2
            }
            release_version=${CAPHE_PACKAGE_VERSION#v}
            ldflags="$ldflags -X github.com/andrew-ships-stuff/caphe/internal/cli.Version=$release_version"
          fi
          go build -tags bundled -trimpath -ldflags="$ldflags" -o "dist/package/$binary" ./cmd/caphe
          cp LICENSE README.md dist/package/
          archive="caphe_${CAPHE_PACKAGE_VERSION}_${GOOS}_${GOARCH}"
          if [[ "$ARCHIVE_FORMAT" == zip ]]; then
            (cd dist/package && zip -q "../${archive}.zip" caphe.exe LICENSE README.md)
          else
            tar -C dist/package -czf "dist/${archive}.tar.gz" caphe LICENSE README.md
          fi
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caphe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/caphe_*
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: caphe-*
          path: release
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd release
          LC_ALL=C sha256sum caphe_* > checksums.txt
      - name: Attest release packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/caphe_*
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Render Homebrew formula
        shell: bash
        run: |
          scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" release/checksums.txt > caphe.rb
          ruby -c caphe.rb
      - name: Publish Homebrew formula
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || {
            echo "HOMEBREW_TAP_TOKEN must grant contents:write on andrew-ships-stuff/homebrew-tap" >&2
            exit 2
          }
          content=$(base64 -w 0 caphe.rb)
          sha=$(gh api repos/andrew-ships-stuff/homebrew-tap/contents/Formula/caphe.rb --jq .sha 2>/dev/null || true)
          args=(--method PUT repos/andrew-ships-stuff/homebrew-tap/contents/Formula/caphe.rb
            -f message="Bump caphe to ${GITHUB_REF_NAME}"
            -f content="$content")
          if [[ -n "$sha" ]]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}"
