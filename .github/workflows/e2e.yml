name: End-to-end
on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-poutine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install checksum-verified workflow tools
        shell: bash
        env:
          CAPHE_TOOL_BIN: ${{ runner.temp }}/caphe-tools/bin
        run: |
          bash scripts/install-tools.sh --tools poutine
          echo "${CAPHE_TOOL_BIN}" >> "$GITHUB_PATH"
      - name: Build Caphe
        run: go build -o bin/caphe ./cmd/caphe
      - name: Run real CLI workflow E2E
        env:
          CAPHE_E2E_STATE_DIR: ${{ runner.temp }}/caphe-e2e-state
          CAPHE_E2E_REPORT: ${{ github.workspace }}/caphe-e2e.sarif
        run: bash scripts/e2e-real.sh ./bin/caphe
      - name: Upload SARIF
        if: ${{ always() && hashFiles('caphe-e2e.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: caphe-e2e.sarif
          category: caphe-poutine
