name: Version

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ github.repository == 'andrew-ships-stuff/caphe' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Calculate next version
        id: version
        shell: bash
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          messages=$(mktemp)
          if [[ -n "$latest" ]]; then
            git log --format=%B "${latest}..HEAD" > "$messages"
          else
            git log --format=%B > "$messages"
          fi
          next=$(scripts/next-version.sh "$latest" "$messages")
          echo "latest=${latest:-none}"
          echo "next=$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Tag release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" -m "Release $VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
      - name: Start release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref "$VERSION"
