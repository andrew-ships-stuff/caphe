apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "caphe.name" . }}-data
  labels:
    {{- include "caphe.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.storage.accessMode | quote }}]
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
