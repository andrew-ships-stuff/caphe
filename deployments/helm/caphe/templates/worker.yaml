apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caphe.name" . }}-worker
  labels:
    {{- include "caphe.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "caphe.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "caphe.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "caphe.name" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: caphe
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - cluster
            - worker
            - --root=/var/lib/caphe/cluster
            - --concurrency={{ .Values.worker.concurrency }}
            - --task-concurrency={{ .Values.worker.taskConcurrency }}
            - --network-enforced
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/caphe/cluster}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ include "caphe.name" . }}-data}
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}
